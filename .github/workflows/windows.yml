name: Windows installer

# Run it by hand from the Actions tab (workflow_dispatch), or push a v* tag.
# The finished Tether-Setup.exe is attached to the run as an artifact.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Build Windows app
        shell: pwsh
        run: |
          flutter build windows --release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            # Surface the real error as an annotation, readable without
            # signing in to GitHub (raw job logs aren't).
            $tail = (Get-Content build.log | Select-String -Pattern 'error|Error|fatal|failed|not found' | Select-Object -Last 12 | ForEach-Object { $_.Line.Trim() }) -join '%0A'
            Write-Host "::error title=flutter build windows failed::$tail"
            exit 1
          }

      # Ship the Visual C++ runtime next to the exe so the app starts on a
      # PC that has never installed the VC++ redistributable.
      - name: Bundle VC++ runtime
        shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "C:\Windows\System32\$dll" build\windows\x64\runner\Release\
          }

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" windows\installer\tether.iss

      - uses: actions/upload-artifact@v4
        with:
          name: Tether-Setup
          path: windows/installer/Output/Tether-Setup.exe
